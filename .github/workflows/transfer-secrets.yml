name: Transfer repository secrets

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transfer:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.SECRET_TRANSFER_TOKEN }}
      PROD_ENV_B64: ${{ secrets.PROD_ENV_B64 }}
      VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_ROOT_PASSWORD: ${{ secrets.VPS_ROOT_PASSWORD }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_USER: ${{ secrets.VPS_USER }}
      YOUTUBE_COOKIES_B64: ${{ secrets.YOUTUBE_COOKIES_B64 }}
    steps:
      - name: Copy secrets without printing values
        shell: bash
        run: |
          set -euo pipefail
          for secret_name in \
            PROD_ENV_B64 \
            VPS_APP_DIR \
            VPS_HOST \
            VPS_ROOT_PASSWORD \
            VPS_SSH_KEY \
            VPS_USER \
            YOUTUBE_COOKIES_B64
          do
            secret_value="${!secret_name}"
            test -n "$secret_value"
            gh secret set "$secret_name" --repo nctay/dawgostan-monorepo --body "$secret_value"
          done
