services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: archive
      POSTGRES_USER: archive
      POSTGRES_PASSWORD: archive
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U archive -d archive"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    image: ${WORKER_IMAGE:?WORKER_IMAGE is required}
    restart: unless-stopped
    volumes:
      - ./private:/run/private
    env_file:
      - path: .env
        required: true
    environment:
      NSFW_CLASSIFIER_URL: http://nsfw:3333/classify
    depends_on:
      postgres:
        condition: service_healthy
      nsfw:
        condition: service_healthy

  nsfw:
    image: ${NSFW_IMAGE:?NSFW_IMAGE is required}
    restart: unless-stopped
    cpus: 1
    mem_limit: 1200m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3333/health', timeout=2).close()"]
      interval: 10s
      timeout: 5s
      retries: 6

  bot:
    image: ${BOT_IMAGE:?BOT_IMAGE is required}
    restart: unless-stopped
    env_file:
      - path: .env
        required: true
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
