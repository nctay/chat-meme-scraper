name: VPS diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          password: ${{ secrets.VPS_ROOT_PASSWORD }}
          command_timeout: 2m
          script: |
            set -u

            echo '=== System ==='
            date -Is
            hostname
            uptime
            id
            free -h
            df -h /

            echo '=== SSH listener ==='
            ss -lntp | grep -E 'State|:22[[:space:]]' || true

            echo '=== Routes to blocked clients ==='
            ip route get 5.165.104.81 || true
            ip route get 213.239.157.69 || true

            echo '=== UFW ==='
            ufw status verbose || true

            echo '=== Firewall rules relevant to SSH ==='
            nft list ruleset 2>/dev/null \
              | grep -Ei 'drop|reject|dport (22|ssh)|5\.165\.104\.81|213\.239\.157\.69' \
              || true

            echo '=== Recent SSH and firewall logs ==='
            journalctl -u ssh --since '-24 hours' --no-pager \
              | grep -E '5\.165\.104\.81|213\.239\.157\.69|Failed|Invalid|Accepted|refused|error' \
              | tail -n 200 \
              || true
            journalctl -k --since '-24 hours' --no-pager \
              | grep -Ei 'UFW|DROP|REJECT|5\.165\.104\.81|213\.239\.157\.69' \
              | tail -n 200 \
              || true

            echo '=== Fail2ban ==='
            fail2ban-client status sshd 2>/dev/null || echo 'not installed or inactive'

            echo '=== Docker ==='
            docker ps --format 'table {{.Names}}\t{{.Status}}\t{{.Image}}' || true
            docker inspect -f '{{.Name}} restarts={{.RestartCount}} state={{.State.Status}}' $(docker ps -q) 2>/dev/null || true

            echo '=== Recent service errors ==='
            cd "${{ secrets.VPS_APP_DIR || '/srv/chat-meme-scraper' }}" || exit 0
            docker compose -f docker-compose.prod.yml logs --since=24h worker bot 2>&1 \
              | grep -Ei 'error|fatal|panic|exception|unhandled|wtv' \
              | tail -n 300 \
              || true
